[project]
name = "council"
# 1.0.0 because the study is finished, not because the API is: this package is
# the apparatus a published result was produced by, so the version names a state
# of the *evidence*. It matches the tag CITATION.cff cites.
version = "1.0.0"
description = "Do language models hold their ground? A controlled study of persuasion in multi-agent committees, scored by the market."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asaf Atia" }]
keywords = ["large-language-models", "multi-agent-systems", "sycophancy", "reproducible-research"]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    # data/fetch.py is a pipeline step, not an optional tool: a clone that
    # cannot fetch the prices cannot reproduce the study. Undeclared until CI's
    # first clean-room install exposed it.
    "yfinance>=0.2",
]

# `council <subcommand>`, which is how the documents have always spelled it -- and
# for the whole study they were wrong, because nothing declared the entry point and
# only `python -m council` worked. Same callable either way: cli.main returns an exit
# code rather than calling sys.exit, so a subcommand stays callable from a test
# without spawning a process.
[project.scripts]
council = "council.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]
# 1.49 is where `width=` replaced `use_container_width`, which the dashboard uses
# and which the versions before it do not accept.
app = ["streamlit>=1.49", "altair>=5.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/council"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The `-m 'not gpu'` is the mechanism, not the marker's description: the card on
# the development machine is busy, so the default invocation has to be the CPU
# one. Opt in with `pytest -m gpu`.
addopts = "-q --strict-markers -m 'not gpu'"
markers = ["gpu: needs a free GPU and a pulled model; deselected by default"]

[tool.coverage.run]
source = ["src/council"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# The tests are the deliverable of half this repo's work, so they are checked
# too: a test whose fixture drifts out of shape passes by asserting nothing.
files = ["src/council", "tests"]

# yfinance ships no py.typed marker. The untyped surface is one call, confined to
# council/data/fetch.py, which converts the result into this project's own schema
# and validates it before anything else sees it.
[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true
