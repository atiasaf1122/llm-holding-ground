[project]
name = "council"
version = "0.1.0"
description = "Do language models hold their ground? A controlled study of persuasion in multi-agent committees, scored by the market."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]
# 1.49 is where `width=` replaced `use_container_width`, which the dashboard uses
# and which the versions before it do not accept.
app = ["streamlit>=1.49", "altair>=5.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/council"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The `-m 'not gpu'` is the mechanism, not the marker's description: the card on
# the development machine is busy, so the default invocation has to be the CPU
# one. Opt in with `pytest -m gpu`.
addopts = "-q --strict-markers -m 'not gpu'"
markers = ["gpu: needs a free GPU and a pulled model; deselected by default"]

[tool.coverage.run]
source = ["src/council"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# The tests are the deliverable of half this repo's work, so they are checked
# too: a test whose fixture drifts out of shape passes by asserting nothing.
files = ["src/council", "tests"]
