name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        # Both extras: the tests import the dashboard layer (app) and the gates
        # themselves are in dev. The first CI run failed for want of exactly
        # this line, and took an undeclared yfinance dependency down with it.
        run: uv sync --frozen --extra dev --extra app
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy (strict)
        # No path argument: `files` in pyproject is the declared scope, and it
        # includes the tests. Naming `src` here silently narrowed the gate to
        # half of what the project says it checks, and 25 type errors
        # accumulated in the tests where nothing was looking.
        run: uv run mypy
      - name: Tests
        # The whole suite runs on the mock provider: no daemon, no GPU, no
        # network. That is a design property of the project, not a CI trick --
        # see MockProvider and `council dryrun`.
        run: uv run pytest -q
